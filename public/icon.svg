<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <!-- Shield Outline -->
  <path d="M256 60 L390 120 C390 260 256 420 256 420 C256 420 122 260 122 120 Z" 
        fill="#ffffff" 
        filter="url(#shadow)" />
  <path d="M256 80 L370 132 C370 250 256 390 256 390 C256 390 142 250 142 132 Z" 
        fill="#dc2626" />
  <!-- Inner Alert Beacon / SOS Icon -->
  <circle cx="256" cy="200" r="26" fill="#ffffff" />
  <rect x="238" y="246" width="36" height="84" rx="18" fill="#ffffff" />
  <!-- Text Label -->
  <text x="256" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">SIAGA</text>
</svg>
